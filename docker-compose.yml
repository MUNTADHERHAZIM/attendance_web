version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: attendance_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=attendance
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_pass
    expose:
      - 5432

  redis:
    image: redis:7-alpine
    container_name: attendance_redis
    expose:
      - 6379

  web:
    build: .
    container_name: attendance_web
    command: >
      bash -c "python manage.py collectstatic --noinput &&
               python manage.py migrate &&
               daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-qb95ki$s+bf*e%cb9vqnn5^cn04i2dl_ustiwl6y0%jql9nt_(
      - DATABASE_URL=postgres://postgres:postgres_pass@db:5432/attendance
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    expose:
      - 8000
    depends_on:
      - db
      - redis

  celery_worker:
    build: .
    container_name: attendance_celery_worker
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://postgres:postgres_pass@db:5432/attendance
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    container_name: attendance_celery_beat
    command: celery -A config beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://postgres:postgres_pass@db:5432/attendance
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.25-alpine
    container_name: attendance_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
